fact_tables:
  - name: factTables/events
    display_name: Events
    table: a.b.c
    timestamp_column: t
    entities:
      - entity: user
        column: user_id
    measures:
      - display_name: m
        column: c

metrics:
  - name: metrics/conversion
    display_name: Conversion
    entity: user
    measurement: measurements/shared

measurements:
  - name: measurements/shared
    display_name: Shared Measurement
    fact_table: factTables/events
    entity: user
    measure: m
    operation: sum
