fact_tables:
  - name: factTables/events
    display_name: Events
    table: a.b.c
    timestamp_column: t
    entities:
      - entity: user
        column: user_id
    measures:
      - display_name: clicks
        column: c
    dimensions:
      - name: platform
        column: p

measurements:
  - name: measurements/ghost-table
    display_name: Ghost Table
    fact_table: factTables/external
    entity: user
    measure: clicks
    operation: sum
  - name: measurements/ghost-measure
    display_name: Ghost Measure
    fact_table: factTables/events
    entity: user
    measure: views
    operation: sum
  - name: measurements/ghost-entity
    display_name: Ghost Entity
    fact_table: factTables/events
    entity: session
    measure: clicks
    operation: sum
  - name: measurements/ghost-dimension
    display_name: Ghost Dimension
    fact_table: factTables/events
    entity: user
    measure: clicks
    operation: sum
    filters:
      - dimension: country
        operation: equals
        values: [SE]

metrics:
  - name: metrics/ghost-measurement
    display_name: Ghost Measurement Metric
    entity: user
    measurement: measurements/external
  - name: metrics/mismatched-entity
    display_name: Mismatched Entity Metric
    entity: session
    measurement: measurements/ghost-measure
