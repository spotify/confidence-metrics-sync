fact_tables:
  - name: factTables/events
    display_name: Events
    table: a.b.c
    timestamp_column: t
    entities:
      - entity: user
        column: user_id
    measures:
      - display_name: m
        column: c

measurements:
  - name: measurements/bad-operation
    display_name: Bad Operation
    fact_table: factTables/events
    entity: user
    measure: m
    operation: total

metrics:
  - name: metrics/bad-window
    display_name: Bad Window
    entity: user
    measurement: measurements/bad-operation
    default_effect_size: -0.5
    measurement_window:
      aggregation_window: 1 day
  - name: metrics/zero-effect
    display_name: Zero Effect
    entity: user
    measurement: measurements/bad-operation
    default_effect_size: 0
