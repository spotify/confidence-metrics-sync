# yaml-language-server: $schema=https://raw.githubusercontent.com/spotify/confidence-metrics-sync/main/internal/schema/metric.schema.json
# Exercises unnamed measures (display_name optional, column is the reference).

fact_tables:
  - name: factTables/simple-events
    display_name: Simple Events
    sql: SELECT user_id, ts, value FROM events
    timestamp_column: ts
    entities:
      - entity: user
        column: user_id
    measures:
      - column: value

measurements:
  - name: measurements/simple-sum
    display_name: Simple Sum
    fact_table: factTables/simple-events
    entity: user
    measure: value
    operation: sum
