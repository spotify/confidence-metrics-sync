# yaml-language-server: $schema=https://raw.githubusercontent.com/spotify/confidence-metrics-sync/main/internal/schema/metric.schema.json
# Exercises schema expressiveness: value caps, metric filters, range/like
# filters, and quantile measurements.

fact_tables:
  - display_name: Warehouse Events
    sql: SELECT user_id, event_time, amount FROM warehouse.events
    timestamp_column: event_time
    entities:
      - entity: user
        column: user_id
    measures:
      - display_name: amount
        column: amount
    dimensions:
      - name: region
        column: region

measurements:
  # Item 1: value cap on an average measurement
  - display_name: Capped Revenue
    fact_table: Revenue Events
    entity: user
    measure: revenue
    operation: sum
    cap:
      max: 1000

  # Item 1: value cap on a ratio measurement (numerator + denominator)
  - display_name: Capped Conversion
    fact_table: Checkout Events
    entity: user
    numerator:
      measure: checkouts_completed
      operation: sum
      cap:
        min: 0
    denominator:
      measure: checkouts_started
      operation: sum
      cap:
        max: 100

  # Item 3: like filter
  - display_name: High Value Streams
    fact_table: Hourly Stream
    entity: user
    measure: minutes_played
    operation: sum
    filters:
      - dimension: content_type
        operation: equals
        values: [music]
      - dimension: platform
        operation: like
        values: ["ios%"]
    metrics:
      # Item 2: metric-level filter on a nested metric
      - display_name: High Value Streams - Day 1
        measurement_window:
          aggregation_window: 86400s
        filters:
          - dimension: platform
            operation: equals
            values: [ios]

  # Item 4: quantile measurement
  - display_name: Median Minutes Played
    fact_table: Hourly Stream
    entity: user
    measure: minutes_played
    operation: sum
    quantile_level: 0.5
    metrics:
      - display_name: Median Minutes - Day 1
        measurement_window:
          aggregation_window: 86400s

  # Item 5: measurement on warehouse fact table
  - display_name: Warehouse Amount
    fact_table: Warehouse Events
    entity: user
    measure: amount
    operation: sum
    filters:
      - dimension: region
        operation: gte
        values: ["A"]

metrics:
  # Item 2: metric-level filter on a flat metric
  - display_name: Revenue - Filtered
    entity: user
    measurement: Capped Revenue
    measurement_window:
      aggregation_window: 86400s
    filters:
      - dimension: platform
        operation: not_equals
        values: [web]

  # Item 3: range filter (between) on a flat metric
  - display_name: Revenue - Between
    entity: user
    measurement: Capped Revenue
    measurement_window:
      aggregation_window: 86400s
    filters:
      - dimension: platform
        operation: between
        values: ["a", "m"]
