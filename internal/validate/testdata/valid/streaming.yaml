# yaml-language-server: $schema=https://raw.githubusercontent.com/spotify/confidence-metrics-sync/main/internal/schema/metric.schema.json

fact_tables:
  - display_name: Hourly Stream
    table: analytics.prod.hourly_stream
    timestamp_column: event_time
    description: Hourly streaming aggregates per user.
    entities:
      - entity: user
        column: user_id
    measures:
      - display_name: minutes_played
        column: ms_played / 60000
        description: Minutes of audio played.
      - display_name: had_stream
        column: stream_count > 0
    dimensions:
      - name: platform
        column: platform
      - name: content_type
        column: content_type

measurements:
  - display_name: Hourly Minutes Played
    fact_table: Hourly Stream
    entity: user
    owner: identities/abc123
    measure: minutes_played
    operation: sum
    null_handling:
      replace_entity_null_with_zero: true
    metrics:
      - display_name: Minutes Played - Day 1
        preferred_direction: increase
        default_effect_size: 0.01
        measurement_window:
          aggregation_window: 86400s
      - display_name: Minutes Played - Day 7
        preferred_direction: increase
        measurement_window:
          aggregation_window: 604800s
          exposure_offset: 0s

  - display_name: Podcast Minutes Played
    fact_table: Hourly Stream
    entity: user
    measure: minutes_played
    operation: sum
    filters:
      - dimension: content_type
        operation: equals
        values: [podcast]

  - display_name: Stream Count
    fact_table: Hourly Stream
    entity: user
    description: Number of stream facts per user; count needs no measure.
    operation: count
